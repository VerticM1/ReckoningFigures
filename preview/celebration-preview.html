<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reckoning Figures · Animation preview</title><link rel="stylesheet" href="styles.css?v=5c9dc93e13ac"></head>
<body><main style="max-width:540px;margin:60px auto;padding:24px"><span class="eyebrow gold">ANIMATION PREVIEW</span><h1 style="margin:18px 0">Replay the celebration.</h1><p class="muted">These are sample results. Previewing does not read or change your saved progress.</p><div style="display:grid;gap:14px;margin:28px 0"><button class="primary" data-days="1">First practice day</button><button class="primary" data-days="20">19 → 20 day streak</button><button class="primary" data-days="0">Another lesson on the same day</button></div><p id="preview-status" role="status" class="muted">Your device’s reduced-motion setting is respected.</p><a href="index.html" class="hint-toggle" style="display:block;margin-top:24px">← Back to Learn</a></main>
<script type="module">
import {celebrateFinish,successBurst} from './celebrations.js';
import {playSound,soundButton,bindSoundButton} from './sound.js';
import {dateKey} from './activity.js';
document.querySelector('main').insertAdjacentHTML('beforeend',soundButton()+`<div class="cue-previews">${[3,5,7].map(n=>`<button class="primary" data-combo="${n}">${n} in a row</button>`).join('')}<button class="primary" data-tone="correct">Correct tone</button><button class="primary" data-tone="wrong">Try-again tone</button></div>`);bindSoundButton();
document.querySelectorAll('[data-combo]').forEach(b=>b.onclick=()=>{successBurst(+b.dataset.combo);playSound(+b.dataset.combo);});
document.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>playSound(b.dataset.tone));
document.querySelectorAll('[data-days]').forEach(button=>button.onclick=()=>{
 const days=Number(button.dataset.days);
 const practiceDays=Array.from({length:Math.max(days,1)},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return dateKey(d);});
 celebrateFinish({xp:150,days:days||20,practiceDays,firstPracticeToday:days>0,scored:10,accuracy:100,seconds:132,independent:true,perfect:true,onComplete:()=>{document.querySelector('#preview-status').textContent='Preview complete. Your saved progress has not changed.';button.focus();}});
});
</script></body></html>
