        }

            color: white;
        }

        #choices {

            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice {
            background: #374151;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.5;
            position: relative;
            padding-left: 50px;
        }

        .choice::before {
            content: attr(data-letter);
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: #4b5563;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #9ca3af;
        }

        .choice:hover {
            background: #4b5563;
            border-color: #6b7280;
            transform: translateY(-2px);
        }

        .choice.selected {
            border-color: #fbbf24;
            background: #4b5563;
        }

        .choice.correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: #10b981;
            animation: correctPulse 0.6s ease;
        }

        .choice.correct::before {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .choice.incorrect {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: #ef4444;
            animation: shake 0.4s ease;
        }

        .choice.incorrect::before {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .choice:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

            align-items: center;
            gap: 12px;
            margin-top: 16px;
            min-height: 40px;

            align-items: center;
            justify-content: center;

            transform: translateY(0);

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

        "diagram": "<figure class=\"coordinate-figure\" style=\"margin:20px 0\"><svg viewBox=\"0 0 380 380\" role=\"img\" aria-label=\"Coordinate graph from minus six to six on both axes. y = 2x − 1; 2y = 4x − 2\" style=\"width:100%;max-width:460px;display:block;margin:auto\"><defs><clipPath id=\"plot\"><rect x=\"40\" y=\"40\" width=\"300\" height=\"300\"/></clipPath></defs><rect x=\"40\" y=\"40\" width=\"300\" height=\"300\" fill=\"#101a24\" stroke=\"#78909c\"/><path d=\"M40 40V340 M40 340H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"40\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">-6</text><text x=\"180\" y=\"344\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">-6</text><path d=\"M65 40V340 M40 315H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M90 40V340 M40 290H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"90\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">-4</text><text x=\"180\" y=\"294\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">-4</text><path d=\"M115 40V340 M40 265H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M140 40V340 M40 240H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"140\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">-2</text><text x=\"180\" y=\"244\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">-2</text><path d=\"M165 40V340 M40 215H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M190 40V340 M40 190H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M215 40V340 M40 165H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M240 40V340 M40 140H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"240\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">2</text><text x=\"180\" y=\"144\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">2</text><path d=\"M265 40V340 M40 115H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M290 40V340 M40 90H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"290\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">4</text><text x=\"180\" y=\"94\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">4</text><path d=\"M315 40V340 M40 65H340\" stroke=\"#344957\" stroke-width=\"1\"/><path d=\"M340 40V340 M40 40H340\" stroke=\"#344957\" stroke-width=\"1\"/><text x=\"340\" y=\"207\" text-anchor=\"middle\" fill=\"#cad9df\" font-size=\"12\">6</text><text x=\"180\" y=\"44\" text-anchor=\"end\" fill=\"#cad9df\" font-size=\"12\">6</text><path d=\"M40 190H340 M190 40V340\" stroke=\"#e4ecef\" stroke-width=\"1.5\"/><text x=\"349\" y=\"195\" fill=\"#e4ecef\">x</text><text x=\"185\" y=\"30\" fill=\"#e4ecef\">y</text><text x=\"179\" y=\"207\" fill=\"#cad9df\" font-size=\"12\">0</text><g clip-path=\"url(#plot)\"><path d=\"M40 515.0L340 -85.0\" fill=\"none\" stroke=\"#65dcf0\" stroke-width=\"3\" /><path d=\"M40 515.0L340 -85.0\" fill=\"none\" stroke=\"#efcb7e\" stroke-width=\"3\" stroke-dasharray=\"8 5\"/></g></svg><figcaption style=\"font-size:14px;line-height:1.6;text-align:center\">Solid blue: y = 2x − 1<br>Dashed gold: 2y = 4x − 2. Each grid square is 1 unit.</figcaption><details style=\"font-size:14px;margin-top:12px\"><summary>Graph values in text</summary><p>y = 2x − 1: (-2, -5), (0, -1), (2, 3).</p><p>2y = 4x − 2: (-2, -5), (0, -1), (2, 3).</p></details></figure>"
    }
];

        const feedback = {
            correct: ['Perfect!', 'Excellent!', 'You got it!', 'Brilliant!', 'Yes!'],
            wrong: ['Not quite', 'Try again', 'Almost']
        };

        const letters = ['A', 'B', 'C', 'D'];

        function showContent() {
            const item = content[state.current];
            
            document.getElementById('mode-badge').className = 'mode-badge ' + item.mode;
            document.getElementById('mode-badge').textContent = item.mode;

            if (item.concept) {
                let html = `<div class="concept-box"><div class="concept-text">${item.concept}</div></div>`;
                document.getElementById('concept-section').innerHTML = html;
            } else {
                document.getElementById('concept-section').innerHTML = '';
            }

            document.getElementById('question-text').innerHTML = item.q;
            document.getElementById('lesson-diagram').innerHTML = item.diagram || '';
            
            const choicesHTML = item.choices.map((c, i) => 
                `<button class="choice" data-choice="${i}" data-letter="${letters[i]}">${c}</button>`
            ).join('');
            document.getElementById('choices').innerHTML = choicesHTML;
            
            document.querySelectorAll('.choice').forEach(btn => {
                btn.addEventListener('click', function() {
                    const choiceIndex = parseInt(this.getAttribute('data-choice'));
                    selectChoice(item.choices[choiceIndex]);
                });
            });
            
            document.getElementById('continue-btn').classList.remove('show');
            document.getElementById('progress-fill').style.width = ((state.current / state.total) * 100) + '%';
            
            if (state.streak >= 2) {
                document.getElementById('streak-label').textContent = state.streak + ' IN A ROW';
            }
            
            document.getElementById('feedback-text').textContent = '';
            document.querySelector('.check-icon').classList.remove('show');
            state.selected = null;
        }

        function selectChoice(choice) {
            if (state.selected) return;
            
            state.selected = choice;
            const item = content[state.current];
            const btns = document.querySelectorAll('.choice');
            
            btns.forEach(btn => {
                btn.disabled = true;
                const btnText = btn.textContent;
                
                if (btnText === choice) {
                    btn.classList.add('selected');
                    
                    setTimeout(() => {
                        if (choice === item.answer) {
                            btn.classList.add('correct');
                            state.correct++;
                            state.streak++;
                            
                            const feedbackMsg = feedback.correct[Math.floor(Math.random() * feedback.correct.length)];
                            document.getElementById('feedback-text').textContent = item.explanation || feedbackMsg;
                            document.querySelector('.check-icon').classList.add('show');
                            document.getElementById('continue-btn').classList.add('show');
                            
                        } else {
                            btn.classList.add('incorrect');
                            state.errors = (state.errors || 0) + 1;
                            document.getElementById('feedback-text').textContent = item.explanations[item.choices.indexOf(choice)];
                            state.streak = 0;
                            document.getElementById('streak-label').textContent = '';
                            
                            setTimeout(() => {
                                btn.classList.remove('selected', 'incorrect');
                                btns.forEach(b => b.disabled = false);
                                state.selected = null;
                            }, 1200);
                        }
                    }, 300);
                }
            });
        }

        function nextContent() {
            state.current++;
            if (state.current < state.total) {
                showContent();
            } else {
                showVictory();
            }
        }

        function showVictory() {
            const perfect = state.correct === state.total && !state.errors;
            
            document.getElementById('victory-msg').textContent = perfect ? 
                'Perfect practice! Every answer was correct on the first try.' : 
                'Great work! You completed Figure 022!';
            
            let badgesHTML = '';
            if (perfect) badgesHTML += '<div class="badge">Flawless</div>';
            if (state.streak >= 5) badgesHTML += '<div class="badge">On Fire</div>';
            
            document.getElementById('victory-badges').innerHTML = badgesHTML || '<div class="badge">Complete</div>';
            document.getElementById('victory').classList.add('show');
            
            const progress = JSON.parse(localStorage.getItem('userProgress') || '{"completed": [], "xp": 0}');
            if (!progress.completed.includes('figure-022')) {
                progress.completed.push('figure-022');
                progress.xp += 150;
            }
            localStorage.setItem('userProgress', JSON.stringify(progress));
        }

        document.getElementById('continue-btn').addEventListener('click', nextContent);
        
        showContent();
    </script>
</body>
